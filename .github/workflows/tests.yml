# The test suite on every pull request into develop: the checks that need no
# browser, then the tracker in Chromium, Firefox and WebKit, then the built site
# (scripts/buildSite.py) the deploy would publish. Other workflows call it too
# (workflow_call), so a deploy runs the same tests rather than a copy.
# See README.md, Testing.
name: Tests

on:
  pull_request:
    branches: [develop]
  # Also after each merge, which re-checks develop itself.
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Installing the browsers' system libraries from the runner's Ubuntu mirror
    # usually takes under a minute, but a slow mirror has taken ten.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test packages
        run: npm ci

      # Not cached: the browsers download in seconds, and the system libraries
      # --with-deps installs from Ubuntu's mirror, the slow part, would need a cache of
      # their own that breaks whenever the runner image changes.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: npx playwright test

      # The deploy publishes the built copy, not the repo, so it gets a pass of its own.
      - name: Build the site
        run: python scripts/buildSite.py

      - name: Test the built site
        run: npx playwright test
        env:
          TEST_SITE_ROOT: _site

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
