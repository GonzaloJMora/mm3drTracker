# The test suite on every pull request into develop: the checks that need no
# browser, then the tracker in Chromium, Firefox and WebKit. Other workflows call
# it too (workflow_call), so a deploy runs the same tests rather than a copy.
# See README.md, Testing.
name: Tests

on:
  pull_request:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test packages
        run: npm ci

      # Keyed on the lockfile, which pins Playwright and so its browsers.
      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      # The browsers come from the cache; the system libraries they need don't.
      - name: Install browser libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Run tests
        run: npx playwright test

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
