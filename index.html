<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>MM3D Rando Tracker</title>
    
    <link rel="icon" type="image/png" href="images/icon.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/itemContainers.css">
    <link rel="stylesheet" href="css/locationContainers.css">
</head>

<body style="background-color: #121212; color: #ffffff;">

    <header>
        <h1>MM3D Rando Tracker</h1>
    </header>

    <main>
        <!-- Mobile Tab Navigation (Hidden on Desktop) -->
        <div class="mobile-tabs">
            <button class="tab-btn active" onclick="switchMobileTab('items')">Item Tracker</button>
            <button class="tab-btn" onclick="switchMobileTab('locations')">Locations</button>
        </div>

        <div class="tracker-layout-wrapper">
            <!-- Item Tracker Section -->
            <div id="item-section" class="tracker-section active-section">
                <div class="grid-container">
                    <div id="item-grid" class="item-grid"></div>
                    <div id="mask-grid" class="item-grid"></div>
                    <div id="dungeon-grid" class="item-grid"></div>
                    <div id="gear-grid" class="item-grid"></div>
                </div>
            </div>

            <!-- Location Tracker Section -->
            <div id="location-section" class="tracker-section">
                <aside id="region-sidebar" class="region-sidebar">
                    <h2></h2>
                    <div id="region-dropdown-container"></div>
                </aside>
            </div>
        </div>
    </main>

    <script src="js/gameStateManager.js"></script>
    <script src="js/itemTracker.js"></script>
    <script src="js/locationTracker.js"></script>
    <script src="js/mobileTabManager.js"></script>
</body>
</html>
