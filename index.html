<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what makes CSS env(safe-area-inset-*) read non-zero,
         which the page needs to clear the iPhone notch and home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>MM3D Randomizer Tracker</title>
    <!-- This tracker's name in the browser's storage (storageKeys.js). The same on both
         pages, and the same as "app" in data/saveLayout.json. -->
    <meta name="tracker-id" content="mm3drTracker">

    <link rel="icon" type="image/png" href="images/icons/icon.png">
    <link rel="icon" sizes="32x32" href="images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="images/icons/icon-180.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="MM3D Randomizer Tracker">

    <!-- Without these, link previews scrape the page and grab images/logo.png, which
         crops badly since it isn't square. -->
    <meta property="og:title" content="MM3D Randomizer Tracker">
    <meta property="og:description" content="A browser-based item/location tracker for Majora's Mask 3D randomizer runs.">
    <meta property="og:image" content="https://gonzalojmora.github.io/mm3drTracker/images/icons/icon-512.png">
    <meta property="og:url" content="https://gonzalojmora.github.io/mm3drTracker/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/pageLayout.css">
    <link rel="stylesheet" href="css/itemGrids.css">
    <link rel="stylesheet" href="css/tooltip.css">
    <link rel="stylesheet" href="css/trackerToolbar.css">
    <link rel="stylesheet" href="css/saveDialog.css">
    <link rel="stylesheet" href="css/settingsPage.css">

    <script src="js/storageKeys.js"></script>
    <script src="js/phoneLayout.js"></script>
    <script src="js/trackerLaunch.js"></script>
</head>

<body>

    <!-- In the phone layout the header is a bar frozen at the top: the logo, the switch
         between the two halves, and the menu button, which opens the toolbar as a menu
         (headerMenu.js). On desktop the switch and the menu button are hidden. -->
    <header>
        <img src="images/logo.png" alt="Majora's Mask 3D Randomizer Tracker">
        <div class="mobile-tabs">
            <button type="button" class="tab-btn active" data-tab="settings" data-section="settings-section">Settings</button>
            <button type="button" class="tab-btn" data-tab="starting" data-section="starting-section">Starting<span class="tab-label-more"> Items</span></button>
        </div>
        <button type="button" id="header-menu-button" class="toolbar-btn" aria-label="Menu" aria-expanded="false" aria-controls="tracker-toolbar"></button>
        <!-- settingsPage.js enables Reset to Defaults and Launch New Tracker once the
             settings have loaded, and loadSave.js enables the two load buttons (Load From
             Autosave when there is one) and shows Resume Tracker while a save is loaded.
             data-menu-keep-out: shown under the bar, outside the menu, in the phone layout. -->
        <div id="tracker-toolbar">
            <button type="button" id="reset-settings" class="toolbar-btn" disabled>Reset to Defaults</button>
            <button type="button" id="load-autosave" class="toolbar-btn" disabled>Load From Autosave</button>
            <button type="button" id="load-file" class="toolbar-btn" disabled>Load From File</button>
            <button type="button" id="resume-tracker" class="toolbar-btn" data-menu-keep-out hidden>Resume Tracker</button>
            <button type="button" id="launch-new-tracker" class="toolbar-btn" disabled>Launch New Tracker</button>
        </div>
        <div id="header-keep-out"></div>
    </header>

    <!-- awaiting-data: hidden until dataLoader.js has the data and every file has drawn from it. -->
    <main class="awaiting-data">
        <div class="tracker-layout-wrapper">
            <div id="settings-section" class="tracker-section active-section">
                <section class="settings-panel" aria-labelledby="settings-panel-title">
                    <h2 id="settings-panel-title">Randomizer Settings</h2>
                    <!-- Every section of settings.json but the item grids one, built by settingsPage.js.
                         On desktop the item grids section's other settings end this list too. -->
                    <div id="settings-list" class="settings-list"></div>
                </section>
            </div>

            <div id="starting-section" class="tracker-section">
                <section class="starting-items" aria-labelledby="starting-items-title">
                    <h2 id="starting-items-title">Starting Items</h2>
                    <!-- What the four kinds of slot mean, drawn with the grids' own slot classes.
                         The wording follows the input: .on-pointer for a mouse, .on-touch for a touchscreen. -->
                    <ul class="slot-legend" aria-label="What the slots mean">
                        <li>
                            <span class="item-slot"><img class="item-image" src="images/Bow.png" alt=""></span>
                            <span><span class="on-pointer"><strong>Click</strong> to start with it or step it up; right-click steps back</span><span class="on-touch"><strong>Tap</strong> to start with it or step it up</span></span>
                        </li>
                        <li>
                            <span class="item-slot set-elsewhere"><img class="item-image" src="images/SwampSmallKey.png" alt=""></span>
                            <span><strong>Set by another setting</strong><span class="on-pointer">; hover to see which</span></span>
                        </li>
                        <li>
                            <span class="item-slot locked-on"><img class="item-image" src="images/DekuMask.png" alt=""></span>
                            <span><strong>Locked on</strong> by another setting</span>
                        </li>
                        <li>
                            <span class="item-slot not-starting"><img class="item-image" src="images/MoonsTear.png" alt=""></span>
                            <span><strong>Not a starting item</strong></span>
                        </li>
                    </ul>
                    <!-- One .item-grid per key in config/grids.json, built by itemGrids.js -->
                    <div class="grid-container"></div>
                    <!-- The item grids section's settings that no slot shows, in the phone layout.
                         On desktop settingsPage.js moves them into the settings panel instead. -->
                    <div id="starting-extras" class="starting-extras"></div>
                </section>
            </div>
        </div>
    </main>

    <!-- Loading animation (common.css, *Loading*). Has to come after main: CSS shows it
         only while main still has awaiting-data. -->
    <div class="page-loading" aria-hidden="true"></div>

    <!-- Filled from data/version.json by dataLoader.js. -->
    <footer id="app-version"></footer>

    <!-- Mobile only (hidden by CSS above the breakpoint). -->
    <button id="back-to-top" type="button" aria-label="Back to top"></button>

    <!-- Before dataLoader.js, which reads the data through them and checks it. -->
    <script src="js/dataModel.js"></script>
    <script src="js/dataChecks.js"></script>
    <script src="js/dataLoader.js" data-skip-regions></script>
    <script src="js/tooltip.js"></script>
    <script src="js/gameStateManager.js"></script>
    <script src="js/settingsState.js"></script>
    <script src="js/settingControls.js"></script>
    <script src="js/itemGrids.js"></script>
    <script src="js/saveCodec.js"></script>
    <script src="js/saveStore.js"></script>
    <script src="js/settingsPage.js"></script>
    <script src="js/loadSave.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/mobileTabManager.js"></script>
    <script src="js/headerMenu.js"></script>
</body>
</html>
